[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piecewise-correlation"
version = "0.0.1"
description = "Similarity between grouped time series using multi-scale correlation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Robert Dillingham" }]
dependencies = [
    "numpy",
    "pandas>=2.2",
    "scipy",
]

[project.optional-dependencies]
plot = ["matplotlib", "seaborn"]
examples = ["alpaca-py", "python-dotenv", "requests", "lxml", "pyarrow"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "jupyterlab",
]

[tool.hatch.build.targets.wheel]
packages = ["src/piecewise_correlation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["general-testing.py"]
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true